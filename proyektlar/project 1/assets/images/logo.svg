<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none" class="w-auto h-10">
  <defs>
    <!-- Neon Electric Blue Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Futuristic Shield / Monogram Container -->
  <g transform="translate(4, 5)">
    <!-- Deep obsidian base -->
    <rect x="2" y="2" width="54" height="54" rx="14" fill="#050B18" stroke="url(#neonCyan)" stroke-width="2.2" filter="drop-shadow(0 0 8px rgba(0, 240, 255, 0.4))"/>
    
    <!-- Stylized Futuristic "N" -->
    <path d="M16 42V18L32 34V18" stroke="url(#neonCyan)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 4px #00F0FF)"/>
    <path d="M32 34L42 24V42" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neon Cyber Spark -->
    <circle cx="44" cy="16" r="3.5" fill="#00F0FF" filter="drop-shadow(0 0 5px #00F0FF)"/>
  </g>

  <!-- Typography: NAJOT TA'LIM -->
  <g transform="translate(74, 12)">
    <text x="0" y="26" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      NAJOT <tspan fill="url(#neonGlow)" filter="drop-shadow(0 0 6px rgba(0, 240, 255, 0.6))">TA'LIM</tspan>
    </text>
    <text x="1" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="2.8">
      ZAMONAVIY KASBLAR MARKAZI
    </text>
  </g>
</svg>
